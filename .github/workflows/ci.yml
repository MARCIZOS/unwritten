name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests for the cue detector and the interview pacing rules
      - run: npm test
      # The build needs no Firebase keys: without them the app shows its setup screen
      - run: npm run build
